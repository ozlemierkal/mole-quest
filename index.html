<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#24130d" />
<title>Mole Quest — v3.4</title>
<style>
  :root{
    --cream:#fff3dd;
    --gold:#ffc857;
    --wood:#5a3422;
    --wood2:#2f1b13;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{min-height:100%;margin:0}
  body{
    font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--cream);
    background:
      radial-gradient(circle at 50% 0%,#61391f 0,transparent 35%),
      linear-gradient(180deg,#28150e,#100906 75%);
    display:flex;justify-content:center;
  }
  .app{
    width:min(100vw,560px);
    padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 16px);
  }
  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .brand{
    margin-right:auto;
    display:flex;align-items:center;gap:8px;
    padding:9px 13px;border-radius:17px;
    background:linear-gradient(#72482d,#3d2317);
    border:2px solid #986b49;
    box-shadow:inset 0 2px 0 #c18e68aa,0 8px 20px #0006;
    font-weight:1000;color:var(--gold);letter-spacing:.4px;
    text-shadow:0 2px 0 #684018;
  }
  .brand span{font-size:21px}
  .pill{
    min-width:72px;text-align:center;
    padding:9px 10px;border-radius:16px;
    background:linear-gradient(#69432c,#3a2117);
    border:2px solid #8e6042;
    box-shadow:inset 0 2px 0 #b88b6a66;
    font-weight:900;
  }
  .shell{
    position:relative;
    padding:9px;
    border-radius:24px;
    background:linear-gradient(180deg,#6b432b,#362017);
    border:3px solid #916446;
    box-shadow:inset 0 0 0 2px #2e1a12,0 18px 34px #0009;
  }
  #board{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:2px;
    aspect-ratio:10/14;
    overflow:hidden;
    border-radius:16px;
    background:#160d09;
    touch-action:none;
    position:relative;
  }
  .cell{
    position:relative;overflow:hidden;
    background:#1c110c center/cover no-repeat;
  }
  .cell::after{
    content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 0 1px #00000030;
    pointer-events:none;
  }
  .wall{background-image:url('wall-tile.png')}
  .dirt{background-image:url('dirt-tile.png')}
  .empty{background-image:url('tunnel-tile.png')}
  .rock{background-image:url('rock-tile.png')}
  .rock.falling{animation:rockDrop .18s ease-out;filter:brightness(1.08)}
  .gem{background-image:url('gem-tile.png');animation:gemPulse 1.45s ease-in-out infinite}
  .player{
    background-image:url('mole-tile.png');
    background-size:128% 128%;
    background-position:50% 53%;
    z-index:3;
    animation:playerStep .16s ease-out;
    filter:drop-shadow(0 2px 3px #0008);
  }
  .enemy{
    background-image:url('enemy-tile.png');
    background-size:145% 145%;
    background-position:50% 96%;
    filter:saturate(.72) brightness(.78);
  }
  .enemy.alert{
    background-size:100% 100%;
    background-position:center;
    filter:none;
    animation:enemyWiggle .48s ease-in-out infinite alternate;
    box-shadow:inset 0 0 14px #ff6f6f66;
    z-index:2;
  }
  .exit{background-image:url('exit-tile.png');filter:saturate(.72) brightness(.72)}
  .exit.open{
    filter:saturate(1.15) brightness(1.12);
    box-shadow:inset 0 0 18px #ffd971bb,0 0 16px #ffd971aa;
    z-index:2;
    animation:exitGlow .8s ease-in-out infinite alternate;
  }
  @keyframes gemPulse{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(1.25);transform:scale(1.05)}}
  @keyframes rockDrop{0%{transform:translateY(-32%)}100%{transform:translateY(0)}}
  @keyframes playerStep{0%{background-size:108% 108%;filter:brightness(1.28) drop-shadow(0 2px 3px #0008)}100%{background-size:128% 128%;filter:brightness(1) drop-shadow(0 2px 3px #0008)}}
  @keyframes enemyWiggle{0%{transform:translateX(-1px) rotate(-1deg)}100%{transform:translateX(1px) rotate(1deg)}}
  @keyframes exitGlow{0%{filter:saturate(1.05) brightness(1.02)}100%{filter:saturate(1.3) brightness(1.32);box-shadow:inset 0 0 24px #ffe28ddd,0 0 22px #ffd15fbb}}
  .score-fx,.exit-fx{
    position:absolute;
    z-index:15;
    transform:translate(-50%,-50%);
    pointer-events:none;
    font-weight:1000;
    text-shadow:0 2px 4px #000,0 0 12px currentColor;
    animation:floatFx .72s ease-out forwards;
  }
  .score-fx{color:#fff5a6;font-size:17px}
  .exit-fx{color:#ffe28a;font-size:19px;white-space:nowrap}
  @keyframes floatFx{0%{opacity:0;transform:translate(-50%,-35%) scale(.72)}22%{opacity:1;transform:translate(-50%,-58%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-125%) scale(.95)}}
  .hud{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
  .status,.level{
    border-radius:15px;background:linear-gradient(#47291c,#29170f);
    border:2px solid #6f482f;box-shadow:inset 0 2px 0 #98705a55;
  }
  .status{padding:11px 13px;font-size:14px;font-weight:750;line-height:1.25}
  .level{padding:11px 13px;min-width:88px;text-align:center;font-weight:950;color:#ffd47b}
  .controls{display:grid;grid-template-columns:repeat(3,78px);gap:8px;justify-content:center;margin-top:14px}
  button{
    appearance:none;border:0;height:66px;border-radius:20px;
    background:linear-gradient(#80604c,#51382c);
    color:#fff4e8;font-size:27px;font-weight:1000;
    box-shadow:inset 0 2px 0 #d1aa8d66,0 6px 0 #281a13,0 10px 16px #0005;
    touch-action:manipulation;
  }
  button:active{transform:translateY(4px);box-shadow:inset 0 2px 0 #d1aa8d66,0 2px 0 #281a13}
  .ghost{visibility:hidden}
  .hint{text-align:center;font-size:12px;opacity:.8;margin-top:10px}
  .death-note{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);
    z-index:12;padding:14px 18px;border-radius:18px;
    background:#2b160fe8;border:2px solid #ffad7a;color:#fff4e8;
    font-weight:1000;font-size:18px;box-shadow:0 14px 34px #000a,0 0 22px #ff885566;
    opacity:0;pointer-events:none;transition:opacity .12s ease,transform .12s ease;
  }
  .death-note.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .shell.hurt{animation:shellShake .24s ease-in-out 1}
  @keyframes shellShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .win{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    padding:22px;background:#000b;z-index:20;
  }
  .card{
    width:min(360px,92vw);overflow:hidden;text-align:center;
    background:linear-gradient(#57331f,#2b1810);
    border:3px solid #8a5b3c;border-radius:24px;box-shadow:0 24px 54px #000b;
  }
  .hero{height:190px;background:url('hero-character.jpg') center 32%/cover no-repeat;border-bottom:2px solid #8a5b3c}
  .card-body{padding:18px}
  .card h2{margin:0 0 8px;color:#ffd15f;font-size:30px}.card p{margin:0 0 16px;color:#f3dfcc}
  .card button{width:100%;height:56px;font-size:18px}
  @media(max-height:780px){
    .app{padding-top:calc(env(safe-area-inset-top) + 4px)}
    .topbar{margin-bottom:6px}.hud{margin-top:6px}.controls{margin-top:8px;grid-template-columns:repeat(3,70px)}
    button{height:56px}.hint{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">⛏️ <span>MOLE QUEST</span></div>
    <div class="pill">💎 <span id="gems">0</span>/<span id="total">0</span></div>
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">❤️ <span id="lives">3</span></div>
  </div>

  <div class="shell" id="shell"><div id="board"></div><div class="death-note" id="deathNote">💥 Bir can gitti!</div></div>

  <div class="hud">
    <div class="status" id="status">Kristalleri topla. Hepsini bulunca çıkış açılacak.</div>
    <div class="level">1–1</div>
  </div>

  <div class="controls">
    <span class="ghost"></span><button data-dir="up">▲</button><span class="ghost"></span>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
  <div class="hint">Her dokunuş = 1 kare. Kayanın altını kazıp çekilince kaya düşer; hareket halindeki kayanın altında kalma.</div>
</div>

<div class="win" id="win">
  <div class="card">
    <div class="hero"></div>
    <div class="card-body">
      <h2>Level Complete! ✨</h2>
      <p>Köstebek bütün kristalleri buldu ve çıkışa ulaştı.</p>
      <button id="again">Tekrar Oyna</button>
    </div>
  </div>
</div>

<script>
const W=10,H=14;
const initial=[
"##########",
"#..dGdR..#",
"#dRdddddG#",
"#dd..d...#",
"#dGdPdRdd#",
"#ddd.dddd#",
"#..Rdd.dE#",
"#ddddGddd#",
"#dRdddddX#",
"#ddddRddd#",
"#GddddddG#",
"#dddRdddd#",
"#dddddddd#",
"##########"
];
let map,px,py,startX,startY,gems,total,score=0,lives=3,open=false,locked=false,moveLock=false,enemyAlert=false;
let fallingRocks=new Set();
const board=document.getElementById('board');
const gemEl=document.getElementById('gems'), totalEl=document.getElementById('total'), scoreEl=document.getElementById('score'), lifeEl=document.getElementById('lives'), statusEl=document.getElementById('status'), winEl=document.getElementById('win');
const shellEl=document.getElementById('shell'), deathNote=document.getElementById('deathNote');

function reset(full=false){
  map=initial.map(r=>r.split(''));gems=0;score=0;open=false;enemyAlert=false;locked=false;fallingRocks=new Set();if(full)lives=3;total=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(map[y][x]==='P'){px=x;py=y;startX=x;startY=y;map[y][x]='.'}
    if(map[y][x]==='G')total++;
  }
  gemEl.textContent=gems;totalEl.textContent=total;scoreEl.textContent=score;lifeEl.textContent=lives;
  statusEl.textContent='Kristalleri topla. Hepsini bulunca çıkış açılacak.';render();
}
function render(){
  board.innerHTML='';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=document.createElement('div');c.className='cell';const t=map[y][x];
    if(x===px&&y===py)c.classList.add('player');
    else if(t==='#')c.classList.add('wall');
    else if(t==='d')c.classList.add('dirt');
    else if(t==='R'){c.classList.add('rock');if(fallingRocks.has(`${x},${y}`))c.classList.add('falling')} 
    else if(t==='G')c.classList.add('gem');
    else if(t==='E'){c.classList.add('exit');if(open)c.classList.add('open')}
    else if(t==='X'){c.classList.add('enemy');if(enemyAlert)c.classList.add('alert')}
    else c.classList.add('empty');
    board.appendChild(c);
  }
}
function showFx(x,y,text,kind='score-fx'){
  const fx=document.createElement('div');
  fx.className=kind;
  fx.textContent=text;
  fx.style.left=((x+.5)/W*100)+'%';
  fx.style.top=((y+.5)/H*100)+'%';
  board.appendChild(fx);
  setTimeout(()=>fx.remove(),760);
}

function enemyLocation(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(map[y][x]==='X')return {x,y};
  return null;
}

function enemyTurn(){
  // Level 1: böcek sabit durur. Sadece yanına gelince uyarı verir.
  const e=enemyLocation();
  if(!e){enemyAlert=false;return false}
  const md=Math.abs(px-e.x)+Math.abs(py-e.y);
  enemyAlert=(md===1);
  if(enemyAlert){
    statusEl.textContent='Mor taş böceği çok yakın! Üzerine gitme ❗';
  }
  return false;
}

function move(dx,dy){
  if(locked)return;
  const nx=px+dx,ny=py+dy;
  if(nx<0||ny<0||nx>=W||ny>=H)return;
  const t=map[ny][nx];
  if(t==='#'||t==='R')return;
  if(t==='X'){hurt('Mor taş böceğine yakalandın!');return}
  if(t==='E'&&!open){statusEl.textContent='Kapı kilitli. Önce bütün kristalleri bul!';return}

  let collected=false,openedNow=false;
  px=nx;py=ny;
  if(t==='d')map[ny][nx]='.';
  if(t==='G'){
    map[ny][nx]='.';
    gems++;
    score+=100;
    gemEl.textContent=gems;
    scoreEl.textContent=score;
    collected=true;
    statusEl.textContent='Kristal bulundu! 💎  +100';
    if(gems===total){
      open=true;
      openedNow=true;
      statusEl.textContent='Tüm kristaller tamam! Çıkış açıldı ✨';
    }
  }
  if(t==='E'&&open){
    score+=500;
    scoreEl.textContent=score;
    render();
    winEl.style.display='flex';
    return;
  }

  rocksFall();
  if(locked)return;
  enemyTurn();
  render();
  if(collected)showFx(nx,ny,'+100 ✨');
  if(openedNow){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(map[y][x]==='E')showFx(x,y,'ÇIKIŞ AÇILDI!','exit-fx');
  }
}
function rocksFall(){
  // v3.4: gerçek ve öngörülebilir kaya fiziği.
  // Kayanın altı boşalınca her hamlede 1 kare düşer.
  // Oyuncu yeni kazdığı anda sabit kaya onu anında ezmez; önce kenara çekilme şansı vardır.
  // Yalnızca bir önceki turdan beri gerçekten düşmekte olan kaya oyuncuya çarparsa can gider.
  const nextFalling=new Set();
  let movedAny=false;

  for(let y=H-2;y>=1;y--){
    for(let x=1;x<W-1;x++){
      if(map[y][x]!=='R') continue;

      const key=`${x},${y}`;
      const wasFalling=fallingRocks.has(key);
      const by=y+1;
      const playerBelow=(px===x&&py===by);

      if(playerBelow){
        if(wasFalling){
          // Kaya gerçekten hareket halindeydi ve oyuncuya çarptı.
          map[y][x]='.';
          map[by][x]='R';
          fallingRocks=new Set();
          render();
          hurt('Düşen kayanın altında kaldın! 🪨');
          return true;
        }
        // Sabit kaya: oyuncu altını yeni kazdıysa bir hamle kaçış payı ver.
        continue;
      }

      if(map[by][x]==='.'){
        map[by][x]='R';
        map[y][x]='.';
        nextFalling.add(`${x},${by}`);
        movedAny=true;
      }
    }
  }

  fallingRocks=nextFalling;
  if(movedAny && !locked){
    statusEl.textContent='Kaya düşüyor! 🪨 Altında kalma.';
  }
  return false;
}
function hurt(msg){
  if(locked)return;
  locked=true;
  moveLock=true;
  lives--;
  lifeEl.textContent=lives;
  statusEl.textContent=msg;
  deathNote.textContent = lives<=0 ? '💥 Oyun bitti!' : '💥 Bir can gitti!';
  deathNote.classList.add('show');
  shellEl.classList.remove('hurt');
  void shellEl.offsetWidth;
  shellEl.classList.add('hurt');

  setTimeout(()=>{
    deathNote.classList.remove('show');
    shellEl.classList.remove('hurt');
    if(lives<=0){
      reset(true);
      statusEl.textContent='Yeni oyun başladı. Dikkatli kaz!';
    } else {
      // Toplanan kristaller ve skor korunur; yalnızca güvenli başlangıç karesine dönülür.
      px=startX;
      py=startY;
      lifeEl.textContent=lives;
      statusEl.textContent='Başlangıç noktasına döndün. Kristallerin ve skorun duruyor.';
      render();
    }
    locked=false;
    moveLock=false;
  },800);
}

function go(d){
  if(locked || moveLock) return;
  moveLock=true;
  if(d==='up')move(0,-1);
  if(d==='down')move(0,1);
  if(d==='left')move(-1,0);
  if(d==='right')move(1,0);
  setTimeout(()=>{ if(!locked) moveLock=false; },120);
}

document.querySelectorAll('[data-dir]').forEach(b=>{
  b.addEventListener('pointerup',e=>{
    e.preventDefault();
    go(b.dataset.dir);
  });
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if(e.key==='ArrowUp')go('up');
  if(e.key==='ArrowDown')go('down');
  if(e.key==='ArrowLeft')go('left');
  if(e.key==='ArrowRight')go('right');
});

document.getElementById('again').onclick=()=>{winEl.style.display='none';reset(true)};
reset(true);
</script>
</body>
</html>
