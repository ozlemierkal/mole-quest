<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#24130d" />
<title>Mole Quest — Visual Prototype</title>
<style>
  :root{
    --cream:#fff3dd;
    --gold:#ffc857;
    --wood:#5a3422;
    --wood2:#2f1b13;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{min-height:100%;margin:0}
  body{
    font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--cream);
    background:
      radial-gradient(circle at 50% 0%,#61391f 0,transparent 35%),
      linear-gradient(180deg,#28150e,#100906 75%);
    display:flex;justify-content:center;
  }
  .app{
    width:min(100vw,560px);
    padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 16px);
  }
  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .brand{
    margin-right:auto;
    display:flex;align-items:center;gap:8px;
    padding:9px 13px;border-radius:17px;
    background:linear-gradient(#72482d,#3d2317);
    border:2px solid #986b49;
    box-shadow:inset 0 2px 0 #c18e68aa,0 8px 20px #0006;
    font-weight:1000;color:var(--gold);letter-spacing:.4px;
    text-shadow:0 2px 0 #684018;
  }
  .brand span{font-size:21px}
  .pill{
    min-width:72px;text-align:center;
    padding:9px 10px;border-radius:16px;
    background:linear-gradient(#69432c,#3a2117);
    border:2px solid #8e6042;
    box-shadow:inset 0 2px 0 #b88b6a66;
    font-weight:900;
  }
  .shell{
    padding:9px;
    border-radius:24px;
    background:linear-gradient(180deg,#6b432b,#362017);
    border:3px solid #916446;
    box-shadow:inset 0 0 0 2px #2e1a12,0 18px 34px #0009;
  }
  #board{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:2px;
    aspect-ratio:10/14;
    overflow:hidden;
    border-radius:16px;
    background:#160d09;
    touch-action:none;
  }
  .cell{
    position:relative;overflow:hidden;
    background:#1c110c center/cover no-repeat;
  }
  .cell::after{
    content:"";position:absolute;inset:0;
    box-shadow:inset 0 0 0 1px #00000030;
    pointer-events:none;
  }
  .wall{background-image:url('wall-tile.png')}
  .dirt{background-image:url('dirt-tile.png')}
  .empty{background-image:url('tunnel-tile.png')}
  .rock{background-image:url('rock-tile.png')}
  .gem{background-image:url('gem-tile.png');animation:gemPulse 1.8s ease-in-out infinite}
  .player{background-image:url('mole-tile.png');z-index:3;animation:moleBob 1.6s ease-in-out infinite}
  .enemy{background-image:url('enemy-tile.png');animation:enemyWiggle 1.4s ease-in-out infinite}
  .exit{background-image:url('exit-tile.png');filter:saturate(.72) brightness(.72)}
  .exit.open{filter:saturate(1.15) brightness(1.1);box-shadow:inset 0 0 18px #ffd971aa,0 0 14px #ffd97188;z-index:2}
  @keyframes gemPulse{50%{filter:brightness(1.18);transform:scale(1.03)}}
  @keyframes moleBob{50%{transform:translateY(-1.5px) scale(1.015)}}
  @keyframes enemyWiggle{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
  .hud{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
  .status,.level{
    border-radius:15px;background:linear-gradient(#47291c,#29170f);
    border:2px solid #6f482f;box-shadow:inset 0 2px 0 #98705a55;
  }
  .status{padding:11px 13px;font-size:14px;font-weight:750;line-height:1.25}
  .level{padding:11px 13px;min-width:88px;text-align:center;font-weight:950;color:#ffd47b}
  .controls{display:grid;grid-template-columns:repeat(3,78px);gap:8px;justify-content:center;margin-top:14px}
  button{
    appearance:none;border:0;height:66px;border-radius:20px;
    background:linear-gradient(#80604c,#51382c);
    color:#fff4e8;font-size:27px;font-weight:1000;
    box-shadow:inset 0 2px 0 #d1aa8d66,0 6px 0 #281a13,0 10px 16px #0005;
    touch-action:manipulation;
  }
  button:active{transform:translateY(4px);box-shadow:inset 0 2px 0 #d1aa8d66,0 2px 0 #281a13}
  .ghost{visibility:hidden}
  .hint{text-align:center;font-size:12px;opacity:.8;margin-top:10px}
  .win{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    padding:22px;background:#000b;z-index:20;
  }
  .card{
    width:min(360px,92vw);overflow:hidden;text-align:center;
    background:linear-gradient(#57331f,#2b1810);
    border:3px solid #8a5b3c;border-radius:24px;box-shadow:0 24px 54px #000b;
  }
  .hero{height:190px;background:url('hero-character.jpg') center 32%/cover no-repeat;border-bottom:2px solid #8a5b3c}
  .card-body{padding:18px}
  .card h2{margin:0 0 8px;color:#ffd15f;font-size:30px}.card p{margin:0 0 16px;color:#f3dfcc}
  .card button{width:100%;height:56px;font-size:18px}
  @media(max-height:780px){
    .app{padding-top:calc(env(safe-area-inset-top) + 4px)}
    .topbar{margin-bottom:6px}.hud{margin-top:6px}.controls{margin-top:8px;grid-template-columns:repeat(3,70px)}
    button{height:56px}.hint{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">⛏️ <span>MOLE QUEST</span></div>
    <div class="pill">💎 <span id="gems">0</span>/<span id="total">0</span></div>
    <div class="pill">❤️ <span id="lives">3</span></div>
  </div>

  <div class="shell"><div id="board"></div></div>

  <div class="hud">
    <div class="status" id="status">Kristalleri topla. Hepsini bulunca çıkış açılacak.</div>
    <div class="level">1–1</div>
  </div>

  <div class="controls">
    <span class="ghost"></span><button data-dir="up">▲</button><span class="ghost"></span>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
  <div class="hint">Ok tuşlarına dokun veya oyun alanında kısa bir kaydırma yap.</div>
</div>

<div class="win" id="win">
  <div class="card">
    <div class="hero"></div>
    <div class="card-body">
      <h2>Level Complete! ✨</h2>
      <p>Köstebek bütün kristalleri buldu ve çıkışa ulaştı.</p>
      <button id="again">Tekrar Oyna</button>
    </div>
  </div>
</div>

<script>
const W=10,H=14;
const initial=[
"##########",
"#..dGdR..#",
"#dRdddddG#",
"#dd..d...#",
"#dGdPdRdd#",
"#ddd.dddd#",
"#..Rdd.dE#",
"#ddddGddd#",
"#dRdddddX#",
"#ddddRddd#",
"#GddddddG#",
"#dddRdddd#",
"#dddddddd#",
"##########"
];
let map,px,py,gems,total,lives=3,open=false,locked=false;
const board=document.getElementById('board');
const gemEl=document.getElementById('gems'), totalEl=document.getElementById('total'), lifeEl=document.getElementById('lives'), statusEl=document.getElementById('status'), winEl=document.getElementById('win');

function reset(full=false){
  map=initial.map(r=>r.split(''));gems=0;open=false;locked=false;if(full)lives=3;total=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(map[y][x]==='P'){px=x;py=y;map[y][x]='.'}
    if(map[y][x]==='G')total++;
  }
  gemEl.textContent=gems;totalEl.textContent=total;lifeEl.textContent=lives;
  statusEl.textContent='Kristalleri topla. Hepsini bulunca çıkış açılacak.';render();
}
function render(){
  board.innerHTML='';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=document.createElement('div');c.className='cell';const t=map[y][x];
    if(x===px&&y===py)c.classList.add('player');
    else if(t==='#')c.classList.add('wall');
    else if(t==='d')c.classList.add('dirt');
    else if(t==='R')c.classList.add('rock');
    else if(t==='G')c.classList.add('gem');
    else if(t==='E'){c.classList.add('exit');if(open)c.classList.add('open')}
    else if(t==='X')c.classList.add('enemy');
    else c.classList.add('empty');
    board.appendChild(c);
  }
}
function move(dx,dy){
  if(locked)return;const nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=W||ny>=H)return;
  const t=map[ny][nx];if(t==='#'||t==='R')return;
  if(t==='X'){hurt('Yeraltı böceğine yakalandın!');return}
  if(t==='E'&&!open){statusEl.textContent='Kapı kilitli. Önce bütün kristalleri bul!';return}
  px=nx;py=ny;
  if(t==='d')map[ny][nx]='.';
  if(t==='G'){
    map[ny][nx]='.';gems++;gemEl.textContent=gems;statusEl.textContent='Kristal bulundu! 💎';
    if(gems===total){open=true;statusEl.textContent='Tüm kristaller tamam! Çıkış açıldı ✨'}
  }
  if(t==='E'&&open){render();winEl.style.display='flex';return}
  rocksFall();render();
}
function rocksFall(){
  for(let y=H-2;y>=1;y--)for(let x=1;x<W-1;x++)if(map[y][x]==='R'){
    const by=y+1;
    if(px===x&&py===by){map[y][x]='.';map[by][x]='R';hurt('Taş başına düştü!');return}
    if(map[by][x]==='.') {map[by][x]='R';map[y][x]='.'}
  }
}
function hurt(msg){
  if(locked)return;locked=true;lives--;lifeEl.textContent=lives;statusEl.textContent=msg;
  setTimeout(()=>{
    if(lives<=0){reset(true);statusEl.textContent='Yeni oyun başladı. Dikkatli kaz!'}
    else{const keep=lives;reset(false);lives=keep;lifeEl.textContent=lives;statusEl.textContent='Bir can gitti. Tekrar dene!'}
    locked=false;
  },420);
}
function go(d){if(d==='up')move(0,-1);if(d==='down')move(0,1);if(d==='left')move(-1,0);if(d==='right')move(1,0)}
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();go(b.dataset.dir)}));
addEventListener('keydown',e=>{if(e.key==='ArrowUp')go('up');if(e.key==='ArrowDown')go('down');if(e.key==='ArrowLeft')go('left');if(e.key==='ArrowRight')go('right')});
let sx=0,sy=0;
board.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
board.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))go(dx>0?'right':'left');else go(dy>0?'down':'up')});
document.getElementById('again').onclick=()=>{winEl.style.display='none';reset(true)};
reset(true);
</script>
</body>
</html>
